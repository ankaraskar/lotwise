
name: Publish Lotwise and refresh official sources

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 8 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lotwise-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PDF parser
        run: python -m pip install 'pypdf>=5,<7'

      - name: Validate official sources
        run: python scripts/sync_sources.py --check-only

      - name: Refresh official regulations
        run: python scripts/sync_sources.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website and updated data
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
