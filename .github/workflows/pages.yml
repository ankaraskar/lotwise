
name: Publish Lotwise and refresh official sources

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 8 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lotwise-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install open-source PDF parser
        run: python -m pip install 'pypdf>=5,<7'

      - name: Validate official-only source list
        run: python scripts/sync_sources.py --check-only

      - name: Refresh approved government documents
        run: python scripts/sync_sources.py

      - name: Persist cached document index
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/index.json site/data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official document index"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
